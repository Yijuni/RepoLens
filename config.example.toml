# RepoLens 本地运行配置模板。复制为 config.toml 后按需修改。
# 不要在此文件或 config.toml 中写 API Key。

[server]
# 相对路径以仓库根目录为基准；也可以填写 Windows 绝对路径。
log_dir = "logs"
port = 0
open_browser = false

[limits]
# 目录树和源码浏览范围。
browse_files = 5000
browse_file_bytes = 1000000
browse_bytes = 64000000
directories = 10000
# Python AST/模型元数据分析范围；超出部分仍可浏览。
analysis_files = 200
analysis_file_bytes = 512000
analysis_bytes = 8000000

[agent]
# Agent 最多使用 max_rounds 次模型请求（含工具探索和修正请求）。
max_rounds = 20
max_repairs = 2
max_tool_calls = 40
max_read_lines = 200
token_budget = 128000
max_output_tokens = 8192
context_chars = 80000
request_timeout_seconds = 60
wall_time_seconds = 180
